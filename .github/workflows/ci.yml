name: CI

# Four jobs, and the split between them is a statement about micro-org rather than about this
# repository.
#
# `estate` calls the shared reusable workflow, which is where the cross-cutting rules live: one
# database per service, no cross-service source imports, /livez + /readyz + /metrics, no env_file
# fan-out, no setInterval doing domain work, and an image that starts and answers /livez. The
# measured target in docs/ecosystem/03 §5 is zero bespoke CI files, and calling it is how this
# repository counts toward that zero rather than against it.
#
# `database` was written when `service-ci.yml` had no Postgres service container. The reusable
# workflow now provides one and fails the build if the database suite skipped, so the suite runs
# there too — what `database` still adds that the reusable workflow does not is the migrator
# exercised AS a migrator, on an empty database, exactly as a deploy runs it.
#
# There is no bespoke `image` job any more. The reusable workflow's image job passes the
# `runtimepkgs`/`contractspkgs` build contexts itself, gives the container a real migrated
# Postgres over host networking, and reads /livez — everything the bespoke job did, plus the
# database it never had (its smoke test pointed the container at 127.0.0.1:5432/ci, an address
# where nothing listened under bridge networking and a database that never existed).

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump, and it
    # has to publish its images before testnet can be deployed from it — which is what proves
    # the release before anything is merged. Mainnet is unaffected: it pins a version tag.
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: market
      database-env-var: MARKET_DATABASE_URL
      port: 4000
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs the variables it declares, not just a
      # database. URLs that are never dialled because /livez needs no upstream, and one GENERATED
      # secret. Never a real credential.
      #
      # ── `=@generate`, AND WHY THE LITERAL THAT WAS HERE HAD TO GO ────────────────────────────
      #
      # This block used to say the tokens "clear a length check", which is the defect stated out
      # loud in configuration: a length check is exactly what micro-org #142's 40-character
      # placeholder cleared on 44 containers. `env.ts` now runs `@cloudsforge/secrets`, which
      # refuses a value that is not SHAPED like a generated secret — and it has no CI exemption and
      # no NODE_ENV branch, deliberately, because an escape hatch is reached for in exactly the
      # hurry that produced the defect. `ci-only-not-a-real-secret-…` normalises to a string
      # containing `cionly` and `notareal`, and is refused twice over.
      #
      # The answer is not a weaker guard. CI does not need a WEAK secret, it needs A secret —
      # nothing in the smoke test verifies a signature against anything else — so the shared
      # workflow expands `=@generate` into a fresh `openssl rand -base64 48` per run and throws it
      # away (micro-org `service-ci.yml`, the `env_args` loop).
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        LEDGER_URL=http://127.0.0.1:4007
        INDEXER_URL=http://127.0.0.1:4004
        POLICY_URL=http://127.0.0.1:4011
        # `MARKET_IDENTITY_CREDENTIAL` IS DELIBERATELY ABSENT, AND `MARKET_SERVICE_TOKEN` WITH IT.
        #
        # It used to be set to `cfsc_ci_only_not_a_real_credential_00000`, which had the right
        # prefix and none of the entropy — `assertServiceCredential` now refuses it on the marker
        # check before it ever reaches the byte floor. There is no `@generate` for a `cfsc_`
        # credential, because identity mints those against a row and a random string with the
        # prefix glued on is a lie the guard exists to catch.
        #
        # Absence is the supported mode and it is the one to smoke: `env.ts` returns `null`,
        # `upstreams.ts` reports `mode: none`, and `/livez` makes no outbound call. What that
        # proves is what the smoke test is for — that the IMAGE boots without a credential, which
        # is the property `env.ts` gives up requiring one in order to keep.
    secrets:
      # @cloudsforge/* resolves via link:../runtime, so the workflow checks out micro-runtime
      # and micro-contracts as siblings — both private, hence a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  database:
    name: The suite, against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Not a secret: this database exists for the duration of one job, is reachable only from it,
        # and holds nothing. A real value here would be a real value in a public log.
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Temporary: the three checkouts and the sibling layout exist only because the runtime and
      # contracts packages are unpublished. On publish this collapses to one checkout.
      - uses: actions/checkout@v4
        with: { path: market }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-runtime, path: runtime, token: "${{ secrets.ESTATE_READ_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-contracts, path: contracts, token: "${{ secrets.ESTATE_READ_TOKEN }}" }

      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: market/pnpm-lock.yaml

      # `link:` resolves to the sibling's own node_modules, so the siblings must be installed
      # before this repository is — without this, `tsc` cannot resolve the sibling source it
      # typechecks (jose, @opentelemetry/api, @cloudsforge/contracts-chain) and `tsx` cannot load
      # @cloudsforge/* at run time.
      - name: Install the sibling runtime and contracts
        run: |
          set -euo pipefail
          pnpm --dir runtime install --frozen-lockfile
          pnpm --dir contracts install --frozen-lockfile

      - name: Install
        working-directory: market
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: market
        run: pnpm typecheck

      - name: Migrate the test database
        working-directory: market
        # The migrator is exercised AS a migrator, on an empty database, exactly as a deploy runs it.
        # A schema created by the test suite instead would never prove the one-shot job works — and
        # `orders_listing_uniq`, `orders_partition` and `listings_active_is_escrowed` only exist
        # because that job ran.
        #
        # ── THE SECRET IS GENERATED IN THE STEP, NOT WRITTEN IN THE `env:` BLOCK ─────────────────
        #
        # `src/migrator.ts` imports `src/env.ts`, which validates the WHOLE configuration at import
        # before it opens a connection — so this step faces `@cloudsforge/secrets` exactly as the
        # container does. `OUTBOX_SIGNING_SECRET` used to be the literal
        # `ci-only-not-a-real-secret-000000000000` here, which the guard refuses on the marker check
        # (`cionly`, `notareal`), and that guard has no CI exemption on purpose: micro-org #142.
        #
        # CI does not need a WEAK secret, it needs A secret. Nothing in this step verifies a
        # signature against anything else, so one is generated per run and thrown away. It is
        # generated rather than committed as a high-entropy literal so that no repository ever holds
        # a string that looks like a key. Same idiom as `=@generate` in the smoke-env above.
        #
        # `MARKET_SERVICE_TOKEN` is gone from this block and must not come back: `env.ts` now holds
        # it to `assertServiceCredential`, which refuses a JWT BY NAME (micro-org #222) and refuses
        # that placeholder besides. It is optional and the migrator dials nobody, so absence is both
        # supported and the honest thing to exercise. `MARKET_IDENTITY_CREDENTIAL` is absent for the
        # same reason — there is no `@generate` for a `cfsc_` credential.
        env:
          MARKET_DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_test
          IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
          IDENTITY_ISSUER: http://127.0.0.1:4001
          LEDGER_URL: http://127.0.0.1:4007
          INDEXER_URL: http://127.0.0.1:4004
          POLICY_URL: http://127.0.0.1:4011
        run: |
          set -euo pipefail
          export OUTBOX_SIGNING_SECRET="$(openssl rand -base64 48)"
          pnpm migrate

      - name: Test
        working-directory: market
        env:
          MARKET_TEST_DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_test
        run: pnpm test

      # A skip is never counted as a pass (docs/ecosystem/14 §16). If MARKET_TEST_DATABASE_URL failed to
      # reach the suite, every database-backed case would silently skip and the job would still be
      # green — which would hide the loss of every concurrency proof in the repository.
      - name: No test was skipped
        working-directory: market
        env:
          MARKET_TEST_DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_test
        run: |
          set -uo pipefail
          output=$(pnpm test 2>&1) || { echo "$output"; exit 1; }
          skipped=$(printf '%s\n' "$output" | grep -oE '^# skipped [0-9]+$' | grep -oE '[0-9]+' || echo 0)
          echo "skipped: ${skipped:-0}"
          [ "${skipped:-0}" = "0" ] || { echo "::error::${skipped} tests were skipped"; exit 1; }

  rules:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Asserted as text so they cannot be deleted in a refactor without a red build. The tests
      # prove they WORK; these prove they are still THERE.
      - name: The three constraints that make double-selling impossible still exist
        run: |
          grep -q 'orders_listing_uniq' src/migrations.ts \
            || { echo '::error::one listing could yield two orders; the same item sold to two buyers'; exit 1; }
          grep -q 'orders_partition' src/migrations.ts \
            || { echo '::error::fee + royalty + proceeds need no longer equal the price; money can leak'; exit 1; }
          grep -q 'listings_active_is_escrowed' src/migrations.ts \
            || { echo '::error::a listing could be active while holding nothing at all'; exit 1; }

      - name: This service still holds no money
        # 04-domain-model §11: no balance column anywhere but the ledger. An escrow row here is a
        # REFERENCE to a ledger reservation — an amount and the entry id that reserved it — never a
        # balance this service could spend. A column named for a balance is the first step of a
        # second ledger, and a second ledger is a ledger that disagrees with the first one.
        run: |
          if grep -nE '^\s+(balance|held_amount|escrow_balance|available)\s' src/migrations.ts; then
            echo '::error::a balance column appeared in the schema; the ledger owns balances'
            exit 1
          fi

      - name: The idempotency fingerprint still excludes the per-attempt fields
        # A fingerprint over correlationId made honest retries 409 in micro-ledger. The regression
        # is pinned there in idempotency.test.ts, and it must not be reintroduced here.
        run: |
          grep -q 'PER_ATTEMPT_FIELDS' src/idempotency.ts \
            || { echo '::error::the per-attempt exclusion is gone; a retry with a fresh trace id would 409'; exit 1; }
          grep -q "'correlationId'" src/idempotency.ts \
            || { echo '::error::correlationId is no longer excluded from the fingerprint'; exit 1; }

      - name: The inbound event webhook still verifies a signature
        # POST /v1/events consumes identity.user.deleted, which cancels a user's listings and
        # refunds their escrows. Unsigned, it is a delist-and-refund-anybody endpoint.
        run: |
          grep -q 'timingSafeEqual' src/server.ts \
            || { echo '::error::the event signature check is gone; POST /v1/events is unauthenticated'; exit 1; }

      - name: Money is never a float
        # Every amount is bigint end to end and numeric(78,0) in the schema. A double precision
        # column, or a Number() over an amount, is a rounding error with a currency symbol on it.
        run: |
          if grep -nE '(double precision|real|float|numeric\([0-9]+, *[1-9])' src/migrations.ts; then
            echo '::error::a floating-point or scaled-decimal money column appeared'
            exit 1
          fi

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments whatever
      # follows. The pattern matches a continuation line of a block comment (leading `*`) that
      # carries a `*/` with more text after it — the only shape that does damage.
      - name: No comment-terminating sequence inside a block comment
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, database, rules, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
