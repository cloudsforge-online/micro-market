name: CI

# Four jobs, and the split between them is a statement about micro-org rather than about this
# repository.
#
# `estate` calls the shared reusable workflow, which is where the cross-cutting rules live: one
# database per service, no cross-service source imports, /livez + /readyz + /metrics, no env_file
# fan-out, no setInterval doing domain work, and an image that starts and answers /livez. The
# measured target in docs/ecosystem/03 §5 is zero bespoke CI files, and calling it is how this
# repository counts toward that zero rather than against it.
#
# `database` is the part the reusable workflow cannot do yet, and it is a gap in micro-org rather
# than a preference here: `service-ci.yml`'s build job has **no Postgres service container**, so a
# suite that tests against a real database cannot run in it. This repository's suite is 275 tests and
# most of them touch Postgres — including every proof that two workers cannot sell one item twice,
# settle one auction twice, release one escrow twice or pay one order out twice, which is the entire
# reason the service exists. Running those against a fixture would be running them against the
# fixture.
#
# **Delete `database` the day `service-ci.yml` gains a `postgres-service` input.** The findings are
# recorded in README.md under "Findings against micro-org"; this file is one of them.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: market
      database-env-var: MARKET_DATABASE_URL
      port: 4000
      # The image build needs two extra build contexts for the unpublished sibling packages (see
      # the Dockerfile header), and `service-ci.yml` has no input for them. Building it here would
      # fail on a COPY from a context that was never passed, so the image is proved by the
      # `image` job below instead — with the contexts.
      build-image: false
    permissions:
      contents: read
      packages: read

  database:
    name: The suite, against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Not a secret: this database exists for the duration of one job, is reachable only from it,
        # and holds nothing. A real value here would be a real value in a public log.
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Temporary: the three checkouts and the sibling layout exist only because the runtime and
      # contracts packages are unpublished. On publish this collapses to one checkout.
      - uses: actions/checkout@v4
        with: { path: market }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-runtime, path: runtime }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-contracts, path: contracts }

      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: market/pnpm-lock.yaml

      - name: Install
        working-directory: market
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: market
        run: pnpm typecheck

      - name: Migrate the test database
        working-directory: market
        # The migrator is exercised AS a migrator, on an empty database, exactly as a deploy runs it.
        # A schema created by the test suite instead would never prove the one-shot job works — and
        # `orders_listing_uniq`, `orders_partition` and `listings_active_is_escrowed` only exist
        # because that job ran.
        env:
          MARKET_DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_test
          IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
          IDENTITY_ISSUER: http://127.0.0.1:4001
          OUTBOX_SIGNING_SECRET: ci-only-not-a-real-secret-000000000000
          LEDGER_URL: http://127.0.0.1:4007
          INDEXER_URL: http://127.0.0.1:4004
          POLICY_URL: http://127.0.0.1:4011
          MARKET_SERVICE_TOKEN: ci-only-not-a-real-token-0000000000000
        run: pnpm migrate

      - name: Test
        working-directory: market
        env:
          MARKET_TEST_DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_test
        run: pnpm test

      # A skip is never counted as a pass (docs/ecosystem/14 §16). If MARKET_TEST_DATABASE_URL failed to
      # reach the suite, every database-backed case would silently skip and the job would still be
      # green — which would hide the loss of every concurrency proof in the repository.
      - name: No test was skipped
        working-directory: market
        env:
          MARKET_TEST_DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_test
        run: |
          set -uo pipefail
          output=$(pnpm test 2>&1) || { echo "$output"; exit 1; }
          skipped=$(printf '%s\n' "$output" | grep -oE '^# skipped [0-9]+$' | grep -oE '[0-9]+' || echo 0)
          echo "skipped: ${skipped:-0}"
          [ "${skipped:-0}" = "0" ] || { echo "::error::${skipped} tests were skipped"; exit 1; }

  image:
    name: The image builds, starts, and answers /livez
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: market }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-runtime, path: runtime }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-contracts, path: contracts }
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: market
          # The two named contexts the Dockerfile documents. They disappear with AD-02.
          build-contexts: |
            runtimepkgs=runtime
            contractpkgs=contracts
          push: false
          load: true
          tags: market:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image proves the Dockerfile parses. It does not prove the image can start, and
      # 'container is unhealthy' with no logs is the shape of silent failure this estate has been
      # bitten by more than once. So: start it, and read the endpoint the load balancer reads.
      #
      # /livez is deliberately the endpoint checked, not /readyz: /readyz probes Postgres, JWKS and
      # the ledger, none of which exist in this job. That /livez is static and /readyz is not is
      # exactly the property being relied on here.
      - name: Start it
        run: |
          set -euo pipefail
          docker run -d --name ci-market -p 127.0.0.1:4000:4000 \
            -e PORT=4000 \
            -e MARKET_DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci \
            -e IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json \
            -e IDENTITY_ISSUER=http://127.0.0.1:4001 \
            -e OUTBOX_SIGNING_SECRET=ci-only-not-a-real-secret-000000000000 \
            -e LEDGER_URL=http://127.0.0.1:4007 \
            -e INDEXER_URL=http://127.0.0.1:4004 \
            -e POLICY_URL=http://127.0.0.1:4011 \
            -e MARKET_SERVICE_TOKEN=ci-only-not-a-real-token-0000000000000 \
            market:ci
          for attempt in $(seq 1 30); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/livez || true)
            [ "$code" = "200" ] && { echo "ok: /livez answered after ${attempt}s"; exit 0; }
            sleep 1
          done
          echo '::error::the image never answered /livez'
          docker logs --tail 60 ci-market
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker logs --tail 100 ci-market || true
      - name: Down
        if: always()
        run: docker rm -f ci-market || true

  rules:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Asserted as text so they cannot be deleted in a refactor without a red build. The tests
      # prove they WORK; these prove they are still THERE.
      - name: The three constraints that make double-selling impossible still exist
        run: |
          grep -q 'orders_listing_uniq' src/migrations.ts \
            || { echo '::error::one listing could yield two orders; the same item sold to two buyers'; exit 1; }
          grep -q 'orders_partition' src/migrations.ts \
            || { echo '::error::fee + royalty + proceeds need no longer equal the price; money can leak'; exit 1; }
          grep -q 'listings_active_is_escrowed' src/migrations.ts \
            || { echo '::error::a listing could be active while holding nothing at all'; exit 1; }

      - name: This service still holds no money
        # 04-domain-model §11: no balance column anywhere but the ledger. An escrow row here is a
        # REFERENCE to a ledger reservation — an amount and the entry id that reserved it — never a
        # balance this service could spend. A column named for a balance is the first step of a
        # second ledger, and a second ledger is a ledger that disagrees with the first one.
        run: |
          if grep -nE '^\s+(balance|held_amount|escrow_balance|available)\s' src/migrations.ts; then
            echo '::error::a balance column appeared in the schema; the ledger owns balances'
            exit 1
          fi

      - name: The idempotency fingerprint still excludes the per-attempt fields
        # A fingerprint over correlationId made honest retries 409 in micro-ledger. The regression
        # is pinned there in idempotency.test.ts, and it must not be reintroduced here.
        run: |
          grep -q 'PER_ATTEMPT_FIELDS' src/idempotency.ts \
            || { echo '::error::the per-attempt exclusion is gone; a retry with a fresh trace id would 409'; exit 1; }
          grep -q "'correlationId'" src/idempotency.ts \
            || { echo '::error::correlationId is no longer excluded from the fingerprint'; exit 1; }

      - name: The inbound event webhook still verifies a signature
        # POST /v1/events consumes identity.user.deleted, which cancels a user's listings and
        # refunds their escrows. Unsigned, it is a delist-and-refund-anybody endpoint.
        run: |
          grep -q 'timingSafeEqual' src/server.ts \
            || { echo '::error::the event signature check is gone; POST /v1/events is unauthenticated'; exit 1; }

      - name: Money is never a float
        # Every amount is bigint end to end and numeric(78,0) in the schema. A double precision
        # column, or a Number() over an amount, is a rounding error with a currency symbol on it.
        run: |
          if grep -nE '(double precision|real|float|numeric\([0-9]+, *[1-9])' src/migrations.ts; then
            echo '::error::a floating-point or scaled-decimal money column appeared'
            exit 1
          fi

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments whatever
      # follows. The pattern matches a continuation line of a block comment (leading `*`) that
      # carries a `*/` with more text after it — the only shape that does damage.
      - name: No comment-terminating sequence inside a block comment
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read
